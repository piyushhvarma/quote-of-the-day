<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote of the Day</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts & Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="wrapper flex justify-center items-center min-h-screen p-4">
      <div class="card w-full max-w-sm sm:max-w-md">
        <div class="card-content flex flex-col space-y-6">

          <!-- Top Bar -->
          <div class="flex justify-between items-center">
            <div class="flex space-x-2">
              <div class="h-3 w-3 rounded-full bg-red-500"></div>
              <div class="h-3 w-3 rounded-full bg-yellow-500"></div>
              <div class="h-3 w-3 rounded-full bg-green-500"></div>
            </div>
            <button id="themeToggle" aria-label="Toggle Theme" class="text-xl">
              <i class="ri-moon-line"></i>
            </button>
          </div>
          <button id="themeToggle" aria-label="Toggle Theme">
            <i class="ri-moon-line"></i>
          </button>
        </div>

          <!-- Quote Section -->
          <!-- Quote Section -->
<main class="text-center px-2 relative">
  <!-- Skeleton Loader -->
  <div id="skeleton" class="animate-pulse hidden">
    <div class="h-6 bg-gray-300 rounded w-3/4 mx-auto mb-4"></div>
    <div class="h-4 bg-gray-300 rounded w-1/2 mx-auto"></div>
  </div>

  <!-- Actual Quote -->
  <sup><i class="ri-double-quotes-l text-2xl text-pink-400"></i></sup>
  <blockquote
    id="data"
    class="px-2 text-base sm:text-lg leading-relaxed font-medium fade-in"
  >
    LISP has assisted a number of our most gifted fellow humans in
    thinking previously impossible thoughts.
  </blockquote>
  <sub><i class="ri-double-quotes-r text-2xl text-pink-400"></i></sub>
</main>
          <!-- Author + Copy Button -->
          <div class="flex justify-end items-center space-x-2 relative">
            <cite
              id="author"
              class="text-sm sm:text-base font-semibold italic text-gray-300"
            >
              — Edsger W. Dijkstra
            </cite>
            <button
              id="copyBtn"
              class="text-gray-300 hover:text-white transition-all"
              aria-label="Copy Quote"
            >
              <i class="ri-file-copy-line"></i>
            </button>
            <span
              id="copiedTooltip"
              class="absolute top-0 right-10 bg-black text-white text-xs px-2 py-1 rounded opacity-0 transition-opacity"
            >
              Copied!
            </span>
          </div>

          <hr />

          <!-- Buttons -->
          <div class="flex flex-col sm:flex-row gap-3 pt-2">
            <button
              id="prevBtn"
              aria-label="Previous Quote"
              class="hidden bg-red-500 hover:bg-red-600 w-full sm:w-auto px-5 py-2.5 rounded-full font-semibold shadow-md text-white transition-all"
            >
              Previous
            </button>
            <button
              id="btn"
              aria-label="Get New Quote"
              class="bg-blue-500 hover:bg-blue-600 w-full sm:w-auto px-5 py-2.5 rounded-full font-semibold shadow-md text-white transition-all"
            >
              New Quote
            </button>
          </div>

          <!-- Loading Spinner -->
          <div id="loading" class="hidden flex justify-center pt-2">
            <i class="ri-loader-4-line animate-spin text-2xl text-pink-400"></i>
          </div>
        </div>
        

      </div>
    </div>
  </div>

  <script>
    const data = document.getElementById("data");
    const btn = document.getElementById("btn");
    const prevBtn = document.getElementById("prevBtn");
    const author = document.getElementById("author");
    const themeToggle = document.getElementById("themeToggle");

    let history = [];
    let currentQuote = {
      text: "LISP has assisted a number of our most gifted fellow humans in thinking previously impossible thoughts.",
      author: "Edsger W. Dijkstra"
    };

    const fallbackQuotes = [
      { text: "The best way to predict the future is to invent it.", author: "Alan Kay" },
      { text: "Code is like humor. When you have to explain it, it's bad.", author: "Cory House" },
      { text: "Programming isn't about what you know; it's about what you can figure out.", author: "Chris Pine" },
      { text: "The only way to learn a new programming language is by writing programs in it.", author: "Dennis Ritchie" },
      { text: "Talk is cheap. Show me the code.", author: "Linus Torvalds" }
    ];

    const apiEndpoints = [
      "https://api.quotable.io/random",
      "https://programming-quotes-api.herokuapp.com/quotes/random",
      "https://zenquotes.io/api/random"
    ];

    function getRandomFallbackQuote() {
      return fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
    }

    function updateUI(quote) {
      data.textContent = quote.text;
      author.textContent = `— ${quote.author}`;
      data.classList.remove("fade-in");
      void data.offsetWidth; // restart animation
      data.classList.add("fade-in");
    }

    async function fetchQuote() {
      btn.textContent = "Loading...";
      btn.disabled = true;

      let quote = null;
      for (let i = 0; i < apiEndpoints.length; i++) {
        try {
          const response = await fetch(apiEndpoints[i]);
          if (!response.ok) throw new Error("API failed");
          const result = await response.json();

          if (apiEndpoints[i].includes("quotable.io")) {
            quote = { text: result.content, author: result.author };
          } else if (apiEndpoints[i].includes("zenquotes.io")) {
            quote = { text: result[0].q, author: result[0].a };
          } else {
            quote = { text: result.en || result.text || result.quote, author: result.author };
          }

    <script>
      const data = document.getElementById("data");
      const btn = document.getElementById("btn");
      const prevBtn = document.getElementById("prevBtn");
      const author = document.getElementById("author");

      let history = [];
      let currentQuote = {
        text: "LISP has assisted a number of our most gifted fellow humans in thinking previously impossible thoughts.",
        author: "Edsger W. Dijkstra",
      };

      const fallbackQuotes = [
        {
          text: "The best way to predict the future is to invent it.",
          author: "Alan Kay",
        },
        {
          text: "Code is like humor. When you have to explain it, it's bad.",
          author: "Cory House",
        },
        {
          text: "Programming isn't about what you know; it's about what you can figure out.",
          author: "Chris Pine",
        },
        {
          text: "The only way to learn a new programming language is by writing programs in it.",
          author: "Dennis Ritchie",
        },
        { text: "Talk is cheap. Show me the code.", author: "Linus Torvalds" },
      ];

      const apiEndpoints = [
        "https://api.quotable.io/random",
        "https://programming-quotes-api.herokuapp.com/quotes/random",
        "https://zenquotes.io/api/random",
      ];

      function getRandomFallbackQuote() {
        return fallbackQuotes[
          Math.floor(Math.random() * fallbackQuotes.length)
        ];
      }

      function updateUI(quote) {
        data.textContent = quote.text;
        author.textContent = `— ${quote.author}`;
        data.classList.remove("fade-in");
        void data.offsetWidth; // restart animation
        data.classList.add("fade-in");
      }

      async function fetchQuote() {
        btn.textContent = "Loading...";
        btn.disabled = true;

        let quote = null;
        for (let i = 0; i < apiEndpoints.length; i++) {
          try {
            const response = await fetch(apiEndpoints[i]);
            if (!response.ok) throw new Error("API failed");
            const result = await response.json();

            if (apiEndpoints[i].includes("quotable.io")) {
              quote = { text: result.content, author: result.author };
            } else if (apiEndpoints[i].includes("zenquotes.io")) {
              quote = { text: result[0].q, author: result[0].a };
            } else {
              quote = {
                text: result.en || result.text || result.quote,
                author: result.author,
              };
            }

            if (quote.text && quote.author) break;
          } catch (err) {
            console.warn("API failed:", err.message);
          }
        }

        if (!quote) quote = getRandomFallbackQuote();

        if (currentQuote) history.push(currentQuote);
        currentQuote = quote;
        updateUI(quote);

        if (history.length > 0) prevBtn.classList.remove("hidden");

        btn.textContent = "New Quote";
        btn.disabled = false;
      }

    // ===================
    // 🌗 THEME TOGGLE
    // ===================
    function applyTheme(theme) {
      document.body.classList.toggle("light-theme", theme === "light");
      themeToggle.innerHTML = theme === "light" 
        ? '<i class="ri-sun-line"></i>' 
        : '<i class="ri-moon-line"></i>';
    }

    const savedTheme = localStorage.getItem("theme");
    const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
    const initialTheme = savedTheme || (prefersLight ? "light" : "dark");
    applyTheme(initialTheme);

    themeToggle.addEventListener("click", () => {
      const newTheme = document.body.classList.contains("light-theme") ? "dark" : "light";
      applyTheme(newTheme);
      localStorage.setItem("theme", newTheme);
    });

    // Initialize UI
    updateUI(currentQuote);
  </script>
</body>
    <!-- JS File -->
    <script src="script.js"></script>
  </body>
</html>
